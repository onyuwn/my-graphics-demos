<html>
    <head>
        <title>jake h shader editor</title>
        <link rel="stylesheet" href="src/main.css">
        <link rel="stylesheet" href="src/tools.css">
        <link rel="stylesheet" href="src/shadereditor.css">
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
            integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
            crossorigin="anonymous"
            defer>
        </script>
        <meta content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=0" name="viewport" />
    </head>
    <body>
        <script type="module" src="src/shaders.js"></script>
        <script type="module" src="src/shadereditor.js"></script>
        <script type="module" src="src/initbuffers.js"></script>
        <script type="module" src="src/drawscene.js"></script>
        <div id="header">
            <h1>Jake&nbsp;&nbsp;H</h1>
            <img id="starsheader" style="transform:scaleX(200%)" src="/blinkingrowstars.gif"/>
        </div>
        <div class="toolRoot">
            <div id="shadersList" class="listView">
                <div class="listViewContent">

                </div>
                <div class="listViewFooter">
                    <button>collapse</button>
                </div>
            </div>
            <div class="workspaceRoot" id="shaderEditorRoot">
                <div class="viewport panel" id="shaderViewport">
                    <div id="shaderViewportControls" class="panelToolBar">
                        <input type="number" id="canvasWidthInput" />
                        <input type="number" id="canvasHeightInput" />
                    </div>
                    <div id="shaderViewportCanvasContainer">
                        <canvas class="outputCanvas" id="shaderEditorCanvas" style="border:1px solid red"></canvas>                    
                    </div>
                </div>
                <div id="shaderEditor" class="workspace panel">
                    <div id="shaderEditorControls" class="panelToolBar">
                        <button id="addNodeButton" class="panelToolBarButton">+</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
