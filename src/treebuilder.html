<html>
    <head>
        <title>jake h</title>
        <link rel="stylesheet" href="main.css">
    </head>
    <body>
        <div id="header">
            <h1>Jake&nbsp;&nbsp;H</h1>
            <img style="transform:scaleX(200%)" src="/blinkingrowstars.gif"/>
            <div id="headerButtons">
                <a>BLOG</a>
                <a>GALLERY</a>
                <a>downloads</a>
                <a>CONTACT</a>
            </div>
        </div>
        <div id="root">
            <script type="module" src="treebuilder.js"></script>
            <div id="sidebar" class="treeBuilderControls">
                <div class="treeBuilderControl">
                    <p>Leaf Length</p>
                    <input id="leafLengthControl" type="range" min="-1.0" max="1.0" step=".05" />
                </div>
                <div class="treeBuilderControl">
                    <p>Leaf Count</p>
                    <input id="leafCountControl" type="range" min="1.0" max="1000.0" step="1" />
                    <input type="number" id="leafCountInput" />
                </div>
                <div class="treeBuilderControl">
                    <p>Leaf Density</p>
                    <input id="leafDensityControl" type="range" min="0.0" max="1000.0" step=".05" />
                </div>
                <div class="treeBuilderControl">
                    <p>Leaf Noise Min</p>
                    <input id="leafNoiseMinControl" type="range" min="-1000.0" max="1000.0" step=".05" />
                </div>
                <div class="treeBuilderControl">
                    <p>Leaf Noise Max</p>
                    <input id="leafNoiseMaxControl" type="range" min="-1000.0" max="1000.0" step=".05" />
                </div>
                <div class="treeBuilderControl">
                    <p>Leaf Length Attenuation</p>
                    <input id="leafLengthAttenuationControl" type="range" min="-4.0" max="4.0" step=".05" />
                </div>
                <div class="treeBuilderControl">
                    <p>Leaf Color</p>
                    <input type="color" id="leafColorControl" />
                </div>
            </div>
            <div id="contentRoot">
                <div class="post" id="treeBuilderRoot">
                    <canvas id="renderer-canvas"></canvas>
                </div>
            </div>
        </div>
    </body>
</html>
